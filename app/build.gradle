plugins {
    id 'com.android.application' version '8.7.3'
}

def keystore = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = 'com.gym.tracker'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.gym.tracker'
        minSdk = 27
        targetSdk = 34
        versionCode = 3
        versionName = '2.1'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile = rootProject.file(keystore['storeFile'])
                storePassword = keystore['storePassword']
                keyAlias = keystore['keyAlias']
                keyPassword = keystore['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            buildConfigField 'String', 'API_URL', '"https://gymtracker-api-rype.onrender.com"'
        }
        debug {
            buildConfigField 'String', 'API_URL', '"http://10.0.2.2:8080"'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

base {
    archivesName = 'GymTracker-' + android.defaultConfig.versionName
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
